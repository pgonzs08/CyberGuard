[project]
name = "cyberguard-backend"
version = "0.1.0"
description = "This project implements the business logic of the CyberGuard project."
readme = "README.md"
authors = [
    { name = "Pablo González Santamarta", email = "pablogonstm@gmail.com" }
]
requires-python = "~=3.11.17"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "langchain>=0.1.13",
    "langchain-community>=0.0.29",
    "langchain-core>=0.1.33",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "motor>=3.3.2",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pymongo>=4.6.2",
    "pypdf>=4.1.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.8.0",
    "ruff>=0.3.0",
    "tiktoken>=0.6.0",
    "uvicorn[standard]>=0.28.0",
]

[tool.uv]
package = false
