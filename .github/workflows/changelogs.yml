name: Generate Changelog and Tag Version

on:
  workflow_run:
    workflows: ["CI - Code Quality & Tests"]
    types:
      - completed
    branches: [ main, feature/* ]

jobs:
  changelog:
    name: Update Changelog & Tag
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --bump
        env:
          OUTPUT: CHANGELOG.md

      # NUEVO PASO: Crear la Pull Request en lugar de hacer Push directo
      - name: Create Pull Request for Changelog
        uses: peter-evans/create-pull-request@v6
        id: cpr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(changelog): update CHANGELOG.md [skip ci]"
          branch: chore/auto-changelog
          title: "chore(changelog): update CHANGELOG.md"
          body: "Automated changelog update generated by Git-Cliff."
          base: main
          delete-branch: true

      # Opcional: Crear el Tag solo si hubo cambios y se generó una versión nueva
      # Nota: El tag apuntará al commit actual del workflow run.
      - name: Create and Push Tag
        if: steps.cpr.outputs.pull-request-number != ''
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          NEW_TAG=$(git-cliff --bump --context | jq -r '.[]? | select(.version != null) | .version' 2>/dev/null || echo "null")
          if [ "$NEW_TAG" = "null" ] || [ -z "$NEW_TAG" ]; then
            # Alternativa si la estructura de jq falló
            NEW_TAG=$(git-cliff --bump --context | jq -r '.. | .version?' | grep -v null | head -n 1)
          fi
          
          if [ "$NEW_TAG" != "null" ] && [ -n "$NEW_TAG" ]; then
            if ! git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
              git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
              git push origin "$NEW_TAG"
            fi
          fi
