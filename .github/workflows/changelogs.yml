name: Generate Changelog on PR Merge

on:
  push:
    branches:
      - feature/*
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  changelog:
    name: Update Changelog
    runs-on: ubuntu-latest
    # IMPORTANTE: Solo se ejecuta si la Pull Request fue aprobada y fusionada (merged)
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Trae todo el historial para que git-cliff pueda leer todos los Conventional Commits
          fetch-depth: 0 

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --bump
        env:
          OUTPUT: CHANGELOG.md

      - name: Create Pull Request for Changelog
        uses: peter-evans/create-pull-request@v6
        id: cpr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(changelog): update CHANGELOG.md [skip ci]"
          branch: chore/update-changelog
          title: "chore(changelog): update CHANGELOG.md"
          body: "Automated changelog update generated by git-cliff based on Conventional Commits."
          base: main
          delete-branch: true
