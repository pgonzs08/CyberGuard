name: CI - Code Quality & Tests

# Cuándo se dispara el workflow
on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  # Tarea 1: Validar y testear el Backend en Python (FastAPI)
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del Backend
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Pasar Linter en el código Python (Ruff/Flake8)
        run: |
          cd backend
          ruff check .

      - name: Ejecutar Pruebas Automáticas (Pytest)
        run: |
          cd backend
          pytest tests/

  # Tarea 2: Validar el Frontend en React (Vite + TypeScript)
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del Frontend
        run: |
          cd frontend
          npm ci

      - name: Validar tipos de TypeScript y pasar Linter
        run: |
          cd frontend
          npm run lint
