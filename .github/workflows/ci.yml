name: CI - Code Quality, Tests & Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  # ------------------------------------------
  # 1. Linters de código y de Dockerfiles
  # ------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Ruff
        run: pip install --no-cache-dir ruff

      - name: Linter de código Python (Ruff)
        run: ruff check .

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del Frontend
        working-directory: ./frontend
        run: npm ci

      - name: Linter en Frontend (Oxlint)
        working-directory: ./frontend
        run: npm run lint

      - name: Instalar Hadolint para validar Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          no-fail: false

      - name: Ejecutar Hadolint en los Dockerfiles de los microservicios
        run: |
          hadolint ./backend/Dockerfile ./frontend/Dockerfile ./qdrant_service/Dockerfile

  # ------------------------------------------
  # 2. Pruebas unitarias (Backend y Frontend)
  # ------------------------------------------
  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias y Pytest para Backend
        run: |
          pip install --no-cache-dir -r ./backend/requirements.txt pytest

      - name: Ejecutar pruebas unitarias del Backend
        working-directory: ./backend
        env:
          NVIDIA_API_KEY: test-key
          NVIDIA_EMBEDDING_MODEL: test-model
        run: pytest tests/

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del Frontend
        working-directory: ./frontend
        run: npm ci

      - name: Ejecutar pruebas unitarias del Frontend
        working-directory: ./frontend
        run: npm test -- --run

  # ------------------------------------------
  # 3. Pruebas de integración con Docker Compose
  # ------------------------------------------
  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configurar Caché de Docker
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Levantar servicios para pruebas de integración
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_EMBEDDING_MODEL: ${{ secrets.NVIDIA_EMBEDDING_MODEL }}
        run: |
          docker compose up -d --wait

      - name: Ejecutar pruebas de integración del Backend
        run: |
          docker compose exec -T backend pytest tests/integration/

      - name: Apagar entorno de integración y limpiar volúmenes
        if: always()
        run: docker compose down -v

  # ------------------------------------------
  # 4. Build y Push a GitHub Container Registry
  # ------------------------------------------
  publish-images:
    needs: [ lint, unit-tests, integration-tests ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - service: qdrant_service
            context: ./qdrant_service
            dockerfile: ./qdrant_service/Dockerfile

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer etiquetas (SemVer y SHA)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Construir y publicar imagen en GHCR
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotar caché de Docker
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache