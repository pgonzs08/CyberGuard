services:
  # --- Backend API (FastAPI + RAG Engine) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberguard_backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/cyberguard
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - cyberguard_net

  # --- Frontend UI (React + Vite served by Nginx) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberguard_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - cyberguard_net

  # --- Base de Datos NoSQL (MongoDB) ---
  mongo:
    image: mongo:7.0
    container_name: cyberguard_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cyberguard_net

  # --- Base de Datos Vectorial (Qdrant) ---
  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: cyberguard_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - cyberguard_net

networks:
  cyberguard_net:
    name: cyberguard_net
    driver: bridge

volumes:
  mongo_data:
  qdrant_data: