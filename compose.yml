services:

  # ------------------------------------------
  # Backend API (FastAPI + RAG Engine)
  # ------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: cyberguard_backend

    ports:
      - "8000:8000"

    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      MONGO_URI: mongodb://mongo:27017/cyberguard
      QDRANT_SERVICE_HOST: qdrant_service
      QDRANT_SERVICE_PORT: "50051"

    depends_on:
      mongo:
        condition: service_healthy

      qdrant_service:
        condition: service_healthy

    networks:
      - cyberguard_net

    dns:
      - 8.8.8.8
      - 1.1.1.1

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - __pycache__/
            - "*.pyc"
            - .git/
            - .venv/
            - "*.egg-info/"

        - action: rebuild
          path: ./backend/requirements.txt

        - action: rebuild
          path: ./backend/Dockerfile


  # ------------------------------------------
  # Frontend UI (React + Vite)
  # ------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    container_name: cyberguard_frontend

    ports:
      - "80:80"
      - "5173:5173"

    networks:
      - cyberguard_net

    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: http://localhost:8000

    command: npm run dev -- --host 0.0.0.0

    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .git/
            - .vite/

        - action: rebuild
          path: ./frontend/package.json

        - action: rebuild
          path: ./frontend/package-lock.json

        - action: rebuild
          path: ./frontend/Dockerfile.dev


  # ------------------------------------------
  # MongoDB
  # ------------------------------------------
  mongo:
    image: mongo:7.0

    container_name: cyberguard_mongo

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        - CMD
        - mongosh
        - --eval
        - db.adminCommand('ping')

      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - cyberguard_net


  # ------------------------------------------
  # Qdrant Vector Database
  # ------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.20.0

    container_name: cyberguard_qdrant

    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r status <&3 &&
          [[ $$status == *' 200 '* ]]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - qdrant_internal_net


  # ------------------------------------------
  # Qdrant Management Microservice
  # ------------------------------------------
  qdrant_service:
    build:
      context: ./qdrant_service
      dockerfile: Dockerfile

    container_name: cyberguard_qdrant_service

    ports:
      # HTTP: healthcheck y documentación (útil en desarrollo).
      - "8080:8080"

    # gRPC: accesible únicamente desde la red interna de servicios,
    # no se publica en el host.
    expose:
      - "50051"

    environment:
      # Conexión interna con la base de datos vectorial
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"

      # Colecciones independientes
      QDRANT_CVE_COLLECTION: cyberguard_cves
      QDRANT_MITRE_COLLECTION: cyberguard_mitre_attack

      # NVIDIA NIM
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_EMBEDDING_MODEL: ${NVIDIA_EMBEDDING_MODEL}

      # Sincronización autónoma de las colecciones (UpdateWorker, README 7.5)
      SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-24}

      # Configuración de la API
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: "8080"

    depends_on:
      qdrant:
        condition: service_healthy

    networks:
      - cyberguard_net
      - qdrant_internal_net

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8080
      --reload

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    develop:
      watch:
        - action: sync
          path: ./qdrant_service/app
          target: /app/app
          ignore:
            - __pycache__/
            - "*.pyc"

        - action: rebuild
          path: ./qdrant_service/requirements.txt

        - action: rebuild
          path: ./qdrant_service/Dockerfile


# ------------------------------------------
# Networks
# ------------------------------------------
networks:
  # Servicios de aplicación: frontend, backend, mongo y qdrant_service.
  cyberguard_net:
    name: cyberguard_net
    driver: bridge

  # Red aislada para la base vectorial: solo qdrant y qdrant_service.
  qdrant_internal_net:
    name: qdrant_internal_net
    driver: bridge
    internal: true


# ------------------------------------------
# Persistent Volumes
# ------------------------------------------
volumes:
  mongo_data:
  qdrant_data: